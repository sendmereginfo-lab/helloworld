<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 16px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #222;
  }
  .app { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 12px;
    padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; font-size: 1rem; border: 2px solid #ddd; border-radius: 8px; }
  input[type=text]:focus { outline: none; border-color: #667eea; }
  button { cursor: pointer; border: 0; border-radius: 8px; font-size: 1rem; }
  .add { padding: 10px 16px; background: #667eea; color: #fff; }
  .add:hover { background: #5568d3; }
  .filters { display: flex; gap: 6px; margin: 16px 0 8px; }
  .filters button { padding: 6px 12px; background: #eee; font-size: .85rem; }
  .filters button.active { background: #667eea; color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eee; }
  li span { flex: 1; word-break: break-word; }
  li.done span { text-decoration: line-through; color: #999; }
  li .del { background: none; color: #d33; font-size: 1.2rem; padding: 0 6px; }
  input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: .85rem; color: #666; }
  .clear { background: none; color: #667eea; font-size: .85rem; }
  .empty { text-align: center; color: #999; padding: 20px 0; }
</style>
</head>
<body>
<main class="app">
  <h1>Todo List</h1>
  <form id="form">
    <input type="text" id="input" placeholder="What needs to be done?" autocomplete="off" required>
    <button class="add" type="submit">Add</button>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" class="active">All</button>
    <button data-f="active">Active</button>
    <button data-f="done">Done</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button class="clear" id="clear">Clear completed</button>
  </footer>
</main>
<script>
  var todos = JSON.parse(localStorage.getItem('todos') || '[]');
  var filter = 'all';
  var list = document.getElementById('list');

  function save() { localStorage.setItem('todos', JSON.stringify(todos)); }

  function render() {
    list.innerHTML = '';
    var shown = todos.filter(function (t) {
      return filter === 'all' || (filter === 'done') === t.done;
    });
    if (!shown.length) {
      var e = document.createElement('li');
      e.className = 'empty'; e.textContent = 'Nothing here.';
      list.appendChild(e);
    }
    shown.forEach(function (t) {
      var li = document.createElement('li');
      if (t.done) li.className = 'done';
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done;
      cb.onchange = function () { t.done = cb.checked; save(); render(); };
      var s = document.createElement('span');
      s.textContent = t.text;
      var d = document.createElement('button');
      d.className = 'del'; d.textContent = '\u00d7'; d.title = 'Delete';
      d.onclick = function () { todos = todos.filter(function (x) { return x !== t; }); save(); render(); };
      li.append(cb, s, d);
      list.appendChild(li);
    });
    var left = todos.filter(function (t) { return !t.done; }).length;
    document.getElementById('count').textContent = left + (left === 1 ? ' item left' : ' items left');
  }

  document.getElementById('form').onsubmit = function (ev) {
    ev.preventDefault();
    var inp = document.getElementById('input');
    var text = inp.value.trim();
    if (!text) return;
    todos.push({ text: text, done: false });
    inp.value = '';
    save(); render();
  };
  document.getElementById('clear').onclick = function () {
    todos = todos.filter(function (t) { return !t.done; }); save(); render();
  };
  document.getElementById('filters').onclick = function (ev) {
    var f = ev.target.dataset.f;
    if (!f) return;
    filter = f;
    Array.prototype.forEach.call(this.children, function (b) { b.classList.toggle('active', b === ev.target); });
    render();
  };
  render();
</script>
</body>
</html>
